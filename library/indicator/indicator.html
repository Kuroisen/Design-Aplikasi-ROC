<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Compliance | Indicator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar untuk Dark Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0f1422] text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200">

    <div class="flex h-screen overflow-hidden">
        
        <!-- WADAH SIDEBAR OTOMATIS (Di-render oleh sidebar.js) -->
        <div id="sidebar-container"></div>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Header / Navbar -->
            <header class="h-16 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center space-x-4">
                    <!-- Tombol Hamburger untuk Layar Mobile -->
                    <button type="button" onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    
                    <!-- Breadcrumb / Judul Halaman -->
                    <div class="flex items-center space-x-2 text-sm overflow-x-auto whitespace-nowrap">
                        <span class="text-slate-500">Library</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <h1 class="font-semibold text-white">Indicator</h1>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-3 shrink-0">
                    <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700/60">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2"></span>
                        System Ready
                    </span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-6">
                
                <!-- Header Title & Tombol Tambah Indicator -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Daftar Indicator</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Kelola indikator kepatuhan, bobot penilaian, dan status aktif.</p>
                    </div>
                    <a href="tambah-indicator.html" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-blue-600/20 flex items-center space-x-2 w-fit shrink-0">
                        <i class="fa-solid fa-plus text-[11px]"></i>
                        <span>Tambah Indicator</span>
                    </a>
                </div>

                <!-- Container Filter di Atas List Data -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl p-5">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                        <div class="space-y-1.5">
                            <label for="filterSearch" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                Cari Kode / Nama
                            </label>
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                                <input type="text" id="filterSearch" oninput="renderTable()" placeholder="Cari kode atau indikator..." class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label for="filterTahun" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                Tahun
                            </label>
                            <select id="filterTahun" onchange="renderTable()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 transition cursor-pointer">
                                <option value="">Semua Tahun</option>
                                <option value="2025">2025</option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>

                        <div class="space-y-1.5">
                            <label for="filterRegulasi" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                Regulasi
                            </label>
                            <select id="filterRegulasi" onchange="renderTable()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 transition cursor-pointer">
                                <option value="">Semua Regulasi</option>
                                <option value="Penerapan Manajemen Risiko">Penerapan Manajemen Risiko</option>
                                <option value="Ketentuan Pelaporan Devisa">Ketentuan Pelaporan Devisa</option>
                                <option value="Tata Kelola Bank Umum">Tata Kelola Bank Umum</option>
                            </select>
                        </div>

                        <div class="space-y-1.5">
                            <label for="filterActive" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                Active
                            </label>
                            <select id="filterActive" onchange="renderTable()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 transition cursor-pointer">
                                <option value="">Semua Status</option>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Container List Data Tabel -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-[#131a29] border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="py-3.5 px-4">Tahun</th>
                                    <th class="py-3.5 px-4">Kode Indicator</th>
                                    <th class="py-3.5 px-4">Nama Indicator</th>
                                    <th class="py-3.5 px-4">Regulasi</th>
                                    <th class="py-3.5 px-4">Nomor Regulasi</th>
                                    <th class="py-3.5 px-4">Bobot (%)</th>
                                    <th class="py-3.5 px-4">Active</th>
                                    <th class="py-3.5 px-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBodyIndicator" class="divide-y divide-slate-800/70">
                                <!-- Di-render otomatis oleh JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <!-- Panggil Script Sidebar Eksternal (2 level dari root folder) -->
    <script src="../../sidebar.js"></script>

    <!-- Script Render Tabel & Toggle Active / Inactive -->
    <script>
        const STORAGE_KEY_INDICATOR = "ecompliance_indicator_v1";

        const defaultIndicatorList = [
            {
                id: 1,
                tahun: "2026",
                kode: "IND-MR-01",
                nama: "Penerapan manajemen risiko operasional dan pelaporan berkala",
                regulasi: "Penerapan Manajemen Risiko",
                nomorRegulasi: "POJK/No.12/2026",
                bobot: 25,
                status: "Active"
            },
            {
                id: 2,
                tahun: "2026",
                kode: "IND-DV-01",
                nama: "Ketepatan penyampaian laporan lalu lintas devisa",
                regulasi: "Ketentuan Pelaporan Devisa",
                nomorRegulasi: "PBI/No.08/2026",
                bobot: 20,
                status: "Active"
            },
            {
                id: 3,
                tahun: "2025",
                kode: "IND-TK-01",
                nama: "Pelaksanaan rapat komite tata kelola terintegrasi",
                regulasi: "Tata Kelola Bank Umum",
                nomorRegulasi: "SEOJK/No.05/2025",
                bobot: 15,
                status: "Inactive"
            }
        ];

        function loadIndicatorData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_INDICATOR);
                if (!raw) {
                    localStorage.setItem(STORAGE_KEY_INDICATOR, JSON.stringify(defaultIndicatorList));
                    return [...defaultIndicatorList];
                }
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [...defaultIndicatorList];
            } catch (e) {
                return [...defaultIndicatorList];
            }
        }

        function saveIndicatorData(list) {
            localStorage.setItem(STORAGE_KEY_INDICATOR, JSON.stringify(list));
        }

        function toggleStatusIndicator(id) {
            const list = loadIndicatorData();
            const updated = list.map(item => {
                if (Number(item.id) === Number(id)) {
                    const nextStatus = item.status === "Active" ? "Inactive" : "Active";
                    return { ...item, status: nextStatus };
                }
                return item;
            });
            saveIndicatorData(updated);
            renderTable();
        }

        function deleteIndicator(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus data indicator ini?")) {
                return;
            }
            const list = loadIndicatorData().filter(item => Number(item.id) !== Number(id));
            saveIndicatorData(list);
            renderTable();
        }

        function renderActiveBadge(status) {
            if (status === "Active") {
                return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Active</span>`;
            }
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-700/40 text-slate-400 border border-slate-600/40">Inactive</span>`;
        }

        function renderTable() {
            const tbody = document.getElementById("tableBodyIndicator");
            const keyword = (document.getElementById("filterSearch")?.value || "").trim().toLowerCase();
            const tahunFilter = document.getElementById("filterTahun")?.value || "";
            const regulasiFilter = document.getElementById("filterRegulasi")?.value || "";
            const activeFilter = document.getElementById("filterActive")?.value || "";

            const data = loadIndicatorData().filter(item => {
                const matchKeyword =
                    !keyword ||
                    String(item.kode || "").toLowerCase().includes(keyword) ||
                    String(item.nama || "").toLowerCase().includes(keyword);
                const matchTahun = !tahunFilter || String(item.tahun || "") === tahunFilter;
                const matchRegulasi = !regulasiFilter || item.regulasi === regulasiFilter;
                const matchActive = !activeFilter || item.status === activeFilter;
                return matchKeyword && matchTahun && matchRegulasi && matchActive;
            });

            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="py-8 px-4 text-center text-slate-500">
                            Tidak ada data indicator yang sesuai dengan filter.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(item => {
                const isActive = item.status === "Active";
                const toggleBtnClass = isActive
                    ? "bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border-amber-500/30"
                    : "bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border-emerald-500/30";
                const toggleIcon = isActive ? "fa-ban" : "fa-circle-check";
                const toggleTooltip = isActive ? "Inactive" : "Active";

                return `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="py-3.5 px-4 text-slate-300 whitespace-nowrap">${item.tahun || "-"}</td>
                        <td class="py-3.5 px-4 font-semibold text-white whitespace-nowrap">${item.kode}</td>
                        <td class="py-3.5 px-4 text-slate-200">${item.nama}</td>
                        <td class="py-3.5 px-4 text-slate-300 whitespace-nowrap">${item.regulasi || "-"}</td>
                        <td class="py-3.5 px-4 text-slate-300 whitespace-nowrap">${item.nomorRegulasi || "-"}</td>
                        <td class="py-3.5 px-4 text-emerald-400 font-semibold whitespace-nowrap">${item.bobot ?? 0}%</td>
                        <td class="py-3.5 px-4 whitespace-nowrap">${renderActiveBadge(item.status)}</td>
                        <td class="py-3.5 px-4 text-right whitespace-nowrap">
                            <div class="inline-flex items-center justify-end space-x-1.5">
                                <button type="button" onclick="toggleStatusIndicator(${item.id})" class="group relative w-7 h-7 inline-flex items-center justify-center rounded-md border transition ${toggleBtnClass}" title="${toggleTooltip}" aria-label="${toggleTooltip}">
                                    <i class="fa-solid ${toggleIcon} text-xs"></i>
                                    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 absolute -top-8 left-1/2 -translate-x-1/2 px-2 py-1 rounded bg-slate-900 text-white text-[10px] font-medium border border-slate-700 shadow-lg whitespace-nowrap z-20">${toggleTooltip}</span>
                                </button>
                                <a href="detail-indicator.html?id=${item.id}" class="group relative w-7 h-7 inline-flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/70 rounded-md transition" title="View" aria-label="View">
                                    <i class="fa-solid fa-eye text-xs"></i>
                                    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 absolute -top-8 left-1/2 -translate-x-1/2 px-2 py-1 rounded bg-slate-900 text-white text-[10px] font-medium border border-slate-700 shadow-lg whitespace-nowrap z-20">View</span>
                                </a>
                                <a href="edit-indicator.html?id=${item.id}" class="group relative w-7 h-7 inline-flex items-center justify-center bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 rounded-md transition" title="Edit" aria-label="Edit">
                                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 absolute -top-8 left-1/2 -translate-x-1/2 px-2 py-1 rounded bg-slate-900 text-white text-[10px] font-medium border border-slate-700 shadow-lg whitespace-nowrap z-20">Edit</span>
                                </a>
                                <button type="button" onclick="deleteIndicator(${item.id})" class="group relative w-7 h-7 inline-flex items-center justify-center bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 rounded-md transition" title="Delete" aria-label="Delete">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 absolute -top-8 left-1/2 -translate-x-1/2 px-2 py-1 rounded bg-slate-900 text-white text-[10px] font-medium border border-slate-700 shadow-lg whitespace-nowrap z-20">Delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        document.addEventListener("DOMContentLoaded", renderTable);
    </script>
</body>
</html>
