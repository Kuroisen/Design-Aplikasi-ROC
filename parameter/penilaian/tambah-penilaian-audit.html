<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Compliance | Tambah Penilaian Audit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar untuk Dark Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0f1422] text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200">

    <div class="flex h-screen overflow-hidden">

        <!-- WADAH SIDEBAR OTOMATIS (Di-render oleh sidebar.js) -->
        <div id="sidebar-container" class="shrink-0"></div>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

            <!-- Top Header / Navbar -->
            <header class="h-16 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center space-x-4">
                    <!-- Tombol Hamburger untuk Layar Mobile -->
                    <button type="button" onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>

                    <!-- Breadcrumb / Judul Halaman -->
                    <div class="flex items-center space-x-2 text-sm overflow-x-auto whitespace-nowrap">
                        <span class="text-slate-500">e-Compliance</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <span class="text-slate-400">Parameter</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <a href="penilaian-audit.html" class="text-slate-400 hover:text-white transition">Penilaian Audit</a>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <h1 class="font-semibold text-white">Tambah Penilaian Audit</h1>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-3 shrink-0">
                    <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700/60">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2"></span>
                        Parameter Audit
                    </span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="flex-1 overflow-y-auto p-8 custom-scrollbar space-y-6">

                <!-- Page Header & Tombol Kembali -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-wide">Tambah Penilaian Audit</h2>
                        <p class="text-xs text-slate-400 mt-1">
                            Isi data tahun, nama penilaian audit, nilai, dan status aktif.
                        </p>
                    </div>

                    <a
                        href="penilaian-audit.html"
                        class="inline-flex items-center justify-center px-4 py-2 rounded-lg text-xs font-medium bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700/70 transition cursor-pointer shrink-0"
                    >
                        <i class="fa-solid fa-arrow-left mr-2"></i> Kembali ke Daftar
                    </a>
                </div>

                <!-- Form Card (Full Lebar Kiri-Kanan) -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl overflow-hidden w-full">
                    <div class="bg-[#131a29] px-6 py-4 border-b border-slate-800 flex items-center space-x-2">
                        <i class="fa-solid fa-file-circle-plus text-blue-400 text-sm"></i>
                        <h3 class="text-sm font-semibold text-white">Form Penilaian Audit</h3>
                    </div>

                    <form id="tambahPenilaianForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5 text-xs">

                        <!-- Tahun -->
                        <div class="space-y-1.5">
                            <label for="tahun" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                                Tahun <span class="text-rose-400">*</span>
                            </label>
                            <input
                                type="number"
                                id="tahun"
                                name="tahun"
                                min="2000"
                                max="2100"
                                value="2026"
                                required
                                placeholder="Contoh: 2026"
                                class="w-full rounded-lg bg-[#131a29] border border-slate-700/80 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                            />
                        </div>

                        <!-- Nama -->
                        <div class="space-y-1.5">
                            <label for="nama" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                                Nama <span class="text-rose-400">*</span>
                            </label>
                            <input
                                type="text"
                                id="nama"
                                name="nama"
                                required
                                placeholder="Contoh: Very High, High, Medium, Low, Very Low"
                                class="w-full rounded-lg bg-[#131a29] border border-slate-700/80 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                            />
                        </div>

                        <!-- Nilai -->
                        <div class="space-y-1.5">
                            <label for="nilai" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                                Nilai <span class="text-rose-400">*</span>
                            </label>
                            <input
                                type="number"
                                id="nilai"
                                name="nilai"
                                min="0"
                                max="100"
                                step="0.01"
                                required
                                placeholder="Contoh: 100.00"
                                class="w-full rounded-lg bg-[#131a29] border border-slate-700/80 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                            />
                        </div>

                        <!-- Status (Checkbox) -->
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                                Status
                            </label>
                            <label for="statusCheckbox" class="flex items-center space-x-3 rounded-lg bg-[#131a29]/80 border border-slate-800 px-4 py-3 cursor-pointer select-none hover:border-slate-700 transition">
                                <input
                                    type="checkbox"
                                    id="statusCheckbox"
                                    name="status"
                                    checked
                                    class="w-4 h-4 rounded bg-[#0b0f19] border-slate-600 text-blue-600 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer accent-blue-600"
                                />
                                <span class="text-xs font-medium text-white">Active</span>
                            </label>
                        </div>

                        <!-- Action Buttons -->
                        <div class="pt-3 border-t border-slate-800/80 flex items-center justify-end gap-3">
                            <a
                                href="penilaian-audit.html"
                                class="px-4 py-2.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer"
                            >
                                Batal
                            </a>
                            <button
                                type="submit"
                                class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/20 transition cursor-pointer"
                            >
                                <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Penilaian Audit
                            </button>
                        </div>

                    </form>
                </div>

            </main>

        </div>
    </div>

    <!-- Panggil Script Sidebar Eksternal -->
    <script src="../../sidebar.js"></script>

    <script>
        const STORAGE_KEY = "ecompliance_penilaian_audit_data";

        function loadExistingData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}

            return [
                { id: "PA-001", tahun: 2026, nama: "Very High", nilai: 100.00, status: "Active", keterangan: "Tingkat penilaian audit Very High dengan nilai 100." },
                { id: "PA-002", tahun: 2026, nama: "High", nilai: 80.00, status: "Active", keterangan: "Tingkat penilaian audit High dengan nilai 80." },
                { id: "PA-003", tahun: 2026, nama: "Medium", nilai: 60.00, status: "Active", keterangan: "Tingkat penilaian audit Medium dengan nilai 60." },
                { id: "PA-004", tahun: 2026, nama: "Low", nilai: 40.00, status: "Active", keterangan: "Tingkat penilaian audit Low dengan nilai 40." },
                { id: "PA-005", tahun: 2026, nama: "Very Low", nilai: 20.00, status: "Active", keterangan: "Tingkat penilaian audit Very Low dengan nilai 20." }
            ];
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const tahun = parseInt(document.getElementById("tahun").value, 10);
            const nama = document.getElementById("nama").value.trim();
            const nilai = parseFloat(document.getElementById("nilai").value);
            const isActive = document.getElementById("statusCheckbox").checked;
            const status = isActive ? "Active" : "Inactive";

            if (!tahun || !nama || Number.isNaN(nilai)) return;

            const currentData = loadExistingData();
            const newItem = {
                id: `PA-${String(currentData.length + 1).padStart(3, "0")}-${Date.now().toString().slice(-3)}`,
                tahun,
                nama,
                nilai,
                status,
                keterangan: `Penilaian audit ${nama} tahun ${tahun} dengan nilai ${nilai.toFixed(2)}.`
            };

            currentData.unshift(newItem);

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
            } catch (e) {}

            window.location.href = "penilaian-audit.html";
        }
    </script>
</body>
</html>
