<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Compliance | Severity Audit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar untuk Dark Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0f1422] text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200">

    <div class="flex h-screen overflow-hidden">
        
        <!-- WADAH SIDEBAR OTOMATIS (Di-render oleh sidebar.js) -->
        <div id="sidebar-container"></div>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Header / Navbar -->
            <header class="h-16 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center space-x-4">
                    <!-- Tombol Hamburger untuk Layar Mobile -->
                    <button type="button" onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    
                    <!-- Breadcrumb / Judul Halaman -->
                    <div class="flex items-center space-x-2 text-sm overflow-x-auto whitespace-nowrap">
                        <span class="text-slate-500">Parameter</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <h1 class="font-semibold text-white">Severity Audit</h1>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-3 shrink-0">
                    <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700/60">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2"></span>
                        System Ready
                    </span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-5">
                
                <!-- Page Header & Tombol Add Severity -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Severity Audit</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Kelola tingkat keparahan temuan audit, bobot penilaian, dan status keaktifannya.</p>
                    </div>
                    <a href="tambah-severity-audit.html" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5 w-fit shrink-0">
                        <i class="fa-solid fa-plus text-[11px]"></i>
                        <span>Add Severity</span>
                    </a>
                </div>

                <!-- Card Filter -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl p-4">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center text-xs">
                        
                        <!-- Filter Tahun -->
                        <div class="md:col-span-3">
                            <select id="filterTahun" onchange="applyFilters()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                                <option value="">Semua Tahun</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                            </select>
                        </div>

                        <!-- Filter Status -->
                        <div class="md:col-span-3">
                            <select id="filterStatus" onchange="applyFilters()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                                <option value="">Semua Status</option>
                                <option value="Aktif">Aktif</option>
                                <option value="Tidak Aktif">Tidak Aktif</option>
                            </select>
                        </div>

                        <!-- Pencarian Severity -->
                        <div class="md:col-span-4 relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="filterSeverity" oninput="applyFilters()" placeholder="Cari severity..." class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>

                        <!-- Reset Filter -->
                        <div class="md:col-span-2 flex justify-end">
                            <button type="button" onclick="resetFilters()" class="w-full px-3.5 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-rotate-left text-[11px]"></i>
                                <span>Reset</span>
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Card Tabel: Tahun, Severity, Bobot, Status, Aksi -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-[#131a29] border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="py-3.5 px-5 w-28">Tahun</th>
                                    <th class="py-3.5 px-5">Severity</th>
                                    <th class="py-3.5 px-5 w-32 text-center">Bobot</th>
                                    <th class="py-3.5 px-5 w-36 text-center">Status</th>
                                    <th class="py-3.5 px-5 w-32 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="severityTableBody" class="divide-y divide-slate-800/70"></tbody>
                        </table>
                    </div>

                    <!-- Footer Info Jumlah Data -->
                    <div class="px-5 py-3 bg-[#131a29]/60 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                        <span id="tableCountLabel">Menampilkan 0 data</span>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <!-- Modal Edit Severity Audit -->
    <div id="editSeverityModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#0b0f19] border border-slate-800 rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-[#131a29] px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400 text-xs"></i>
                    <h3 class="text-sm font-semibold text-white">Edit Severity Audit</h3>
                </div>
                <button type="button" onclick="closeEditSeverityModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleEditSeveritySubmit(event)" class="p-5 space-y-4 text-xs">
                <input type="hidden" id="editSeverityId">

                <div class="space-y-1.5">
                    <label for="editTahun" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Tahun <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="editTahun" required class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label for="editSeverityName" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Severity <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="editSeverityName" required class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label for="editBobot" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Bobot (%) <span class="text-rose-500">*</span>
                    </label>
                    <input type="number" step="any" min="0" max="100" id="editBobot" required class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label for="editStatus" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Status
                    </label>
                    <select id="editStatus" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                        <option value="Aktif">Aktif</option>
                        <option value="Tidak Aktif">Tidak Aktif</option>
                    </select>
                </div>

                <div class="pt-3 border-t border-slate-800 flex items-center justify-end space-x-2.5">
                    <button type="button" onclick="closeEditSeverityModal()" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition">
                        Batal
                    </button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5">
                        <i class="fa-solid fa-floppy-disk text-[11px]"></i>
                        <span>Update</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panggil Script Sidebar Eksternal -->
    <script src="../../sidebar.js"></script>

    <!-- Script Data, Filter & Aksi Severity Audit -->
    <script>
        const STORAGE_KEY = "ecompliance_severity_audit_v3";

        const defaultSeverity = [
            { id: 1, tahun: "2026", severity: "Critical", bobot: 40, status: "Aktif" },
            { id: 2, tahun: "2026", severity: "High", bobot: 30, status: "Aktif" },
            { id: 3, tahun: "2026", severity: "Medium", bobot: 20, status: "Aktif" },
            { id: 4, tahun: "2026", severity: "Low", bobot: 10, status: "Aktif" }
        ];

        function getSeverityBulletClass(severityName) {
            const key = String(severityName || "").toLowerCase();
            if (key.includes("critical") || key.includes("kritis") || key.includes("ekstrem")) {
                return "bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.65)]";
            }
            if (key.includes("high") || key.includes("tinggi")) {
                return "bg-orange-500 shadow-[0_0_8px_rgba(249,115,22,0.65)]";
            }
            if (key.includes("medium") || key.includes("sedang") || key.includes("menengah") || key.includes("moderate")) {
                return "bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.65)]";
            }
            if (key.includes("low") || key.includes("rendah")) {
                return "bg-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.65)]";
            }
            return "bg-indigo-400 shadow-[0_0_8px_rgba(129,140,248,0.65)]";
        }

        function formatBobotPersen(bobotValue) {
            const num = Number(bobotValue);
            if (Number.isNaN(num)) return "0%";
            const normalized = num > 0 && num <= 1 ? num * 100 : num;
            const clean = Number.isInteger(normalized)
                ? String(normalized)
                : String(Number(normalized.toFixed(2)));
            return `${clean}%`;
        }

        function normalizeSeverityItem(item, index) {
            return {
                id: item.id ?? index + 1,
                tahun: String(item.tahun ?? "2026"),
                severity: item.severity ?? item.nama ?? "-",
                bobot: Number(item.bobot ?? 0),
                status: item.status === "Tidak Aktif" ? "Tidak Aktif" : "Aktif"
            };
        }

        function loadSeverityData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed.map(normalizeSeverityItem);
                    }
                } catch (e) {
                    console.error("Gagal membaca data severity audit:", e);
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultSeverity));
            return defaultSeverity.map(normalizeSeverityItem);
        }

        let severityList = loadSeverityData();

        function saveSeverityData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(severityList));
        }

        function syncTahunFilterOptions() {
            const select = document.getElementById("filterTahun");
            const currentVal = select.value;
            const yearsFromData = [...new Set(severityList.map(s => String(s.tahun)).filter(Boolean))];
            const baseYears = ["2026", "2025", "2024"];
            const allYears = [...new Set([...yearsFromData, ...baseYears])].sort((a, b) => b.localeCompare(a));

            select.innerHTML = `<option value="">Semua Tahun</option>` + allYears
                .map(yr => `<option value="${yr}">${yr}</option>`)
                .join("");

            if (allYears.includes(currentVal)) {
                select.value = currentVal;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("severityTableBody");
            const countLabel = document.getElementById("tableCountLabel");

            if (!data.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 px-5 text-center text-xs text-slate-500">
                            Tidak ada data severity audit yang sesuai dengan filter.
                        </td>
                    </tr>
                `;
                countLabel.textContent = "Menampilkan 0 data";
                return;
            }

            tbody.innerHTML = data.map(item => {
                const isAktif = item.status === "Aktif";
                const badgeClass = isAktif
                    ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
                    : "bg-slate-700/40 text-slate-400 border-slate-600/60";

                const toggleIconClass = isAktif
                    ? "fa-solid fa-ban text-amber-400"
                    : "fa-solid fa-circle-check text-emerald-400";
                const toggleTitle = isAktif ? "Nonaktifkan" : "Aktifkan";
                const bulletClass = getSeverityBulletClass(item.severity);
                const bobotFormatted = formatBobotPersen(item.bobot);

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3.5 px-5 font-medium text-slate-300">${item.tahun}</td>
                        <td class="py-3.5 px-5 font-semibold text-white">
                            <span class="inline-flex items-center space-x-2.5">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0 ${bulletClass}"></span>
                                <span>${item.severity}</span>
                            </span>
                        </td>
                        <td class="py-3.5 px-5 text-center font-medium text-slate-200">${bobotFormatted}</td>
                        <td class="py-3.5 px-5 text-center">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${badgeClass}">
                                ${item.status}
                            </span>
                        </td>
                        <td class="py-3.5 px-5 text-right">
                            <div class="inline-flex items-center justify-end space-x-2">
                                <button type="button" onclick="openEditSeverityModal(${item.id})" title="Edit" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 transition">
                                    <i class="fa-solid fa-pen-to-square text-xs text-indigo-400"></i>
                                </button>
                                <button type="button" onclick="toggleStatus(${item.id})" title="${toggleTitle}" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/70 transition">
                                    <i class="${toggleIconClass} text-xs"></i>
                                </button>
                                <button type="button" onclick="deleteSeverity(${item.id})" title="Hapus" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");

            countLabel.textContent = `Menampilkan ${data.length} dari ${severityList.length} data`;
        }

        function openEditSeverityModal(id) {
            const target = severityList.find(s => s.id === id);
            if (!target) return;

            const bobotNum = Number(target.bobot);
            const normalizedBobot = bobotNum > 0 && bobotNum <= 1 ? bobotNum * 100 : bobotNum;

            document.getElementById("editSeverityId").value = target.id;
            document.getElementById("editTahun").value = target.tahun;
            document.getElementById("editSeverityName").value = target.severity;
            document.getElementById("editBobot").value = normalizedBobot;
            document.getElementById("editStatus").value = target.status;

            document.getElementById("editSeverityModal").classList.remove("hidden");
            document.getElementById("editSeverityName").focus();
        }

        function closeEditSeverityModal() {
            document.getElementById("editSeverityModal").classList.add("hidden");
        }

        function handleEditSeveritySubmit(event) {
            event.preventDefault();
            const id = Number(document.getElementById("editSeverityId").value);
            const tahun = document.getElementById("editTahun").value.trim();
            const severity = document.getElementById("editSeverityName").value.trim();
            const bobot = Number(document.getElementById("editBobot").value);
            const status = document.getElementById("editStatus").value;

            if (!tahun || !severity || Number.isNaN(bobot)) return;

            const target = severityList.find(s => s.id === id);
            if (target) {
                target.tahun = tahun;
                target.severity = severity;
                target.bobot = bobot;
                target.status = status;
                saveSeverityData();
                syncTahunFilterOptions();
            }

            closeEditSeverityModal();
            applyFilters();
        }

        function toggleStatus(id) {
            const target = severityList.find(s => s.id === id);
            if (!target) return;
            target.status = target.status === "Aktif" ? "Tidak Aktif" : "Aktif";
            saveSeverityData();
            applyFilters();
        }

        function deleteSeverity(id) {
            const target = severityList.find(s => s.id === id);
            if (!target) return;
            if (confirm(`Hapus severity "${target.severity}" (${target.tahun})?`)) {
                severityList = severityList.filter(s => s.id !== id);
                saveSeverityData();
                syncTahunFilterOptions();
                applyFilters();
            }
        }

        function applyFilters() {
            const tahunVal = document.getElementById("filterTahun").value;
            const statusVal = document.getElementById("filterStatus").value;
            const searchVal = document.getElementById("filterSeverity").value.toLowerCase().trim();

            const filtered = severityList.filter(item => {
                const matchTahun = !tahunVal || String(item.tahun) === tahunVal;
                const matchStatus = !statusVal || item.status === statusVal;
                const matchSearch = !searchVal || item.severity.toLowerCase().includes(searchVal);
                return matchTahun && matchStatus && matchSearch;
            });

            renderTable(filtered);
        }

        function resetFilters() {
            document.getElementById("filterTahun").value = "";
            document.getElementById("filterStatus").value = "";
            document.getElementById("filterSeverity").value = "";
            renderTable(severityList);
        }

        document.addEventListener("DOMContentLoaded", () => {
            syncTahunFilterOptions();
            renderTable(severityList);
        });
    </script>
</body>
</html>
