<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Compliance | Tambah Rating Penilaian</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar untuk Dark Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0f1422] text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200">

    <div class="flex h-screen overflow-hidden">
        
        <!-- WADAH SIDEBAR OTOMATIS (Di-render oleh sidebar.js) -->
        <div id="sidebar-container"></div>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Header / Navbar -->
            <header class="h-16 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center space-x-4">
                    <!-- Tombol Hamburger untuk Layar Mobile -->
                    <button type="button" onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    
                    <!-- Breadcrumb / Judul Halaman -->
                    <div class="flex items-center space-x-2 text-sm overflow-x-auto whitespace-nowrap">
                        <span class="text-slate-500">Parameter</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <a href="rating-penilaian.html" class="text-slate-500 hover:text-slate-300 transition">Rating Penilaian</a>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <h1 class="font-semibold text-white">Tambah Rating Penilaian</h1>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-3 shrink-0">
                    <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700/60">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2"></span>
                        System Ready
                    </span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-6">
                
                <!-- Back Button & Header Title -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Tambah Rating Penilaian</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Pilih tahun, isikan rating, rentang nilai minimum-maksimum, deskripsi, dan status aktif.</p>
                    </div>
                    <a href="rating-penilaian.html" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition flex items-center space-x-2 w-fit shrink-0">
                        <i class="fa-solid fa-arrow-left text-[11px]"></i>
                        <span>Kembali ke Rating Penilaian</span>
                    </a>
                </div>

                <!-- Form Card -->
                <form onsubmit="handleFormSubmit(event)" class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl overflow-hidden">
                    <div class="bg-[#131a29] px-6 py-4 border-b border-slate-800 flex items-center space-x-2">
                        <i class="fa-solid fa-star-half-stroke text-indigo-400 text-sm"></i>
                        <h3 class="text-sm font-semibold text-white tracking-wide">Formulir Rating Penilaian</h3>
                    </div>

                    <div class="p-6 flex flex-col space-y-5 text-xs">
                        
                        <!-- 1. Tahun (Dropdown) & Rating -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="space-y-2">
                                <label for="selectTahun" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    Tahun <span class="text-rose-500">*</span>
                                </label>
                                <select id="selectTahun" required class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                                    <option value="2026" selected>2026</option>
                                    <option value="2025">2025</option>
                                    <option value="2024">2024</option>
                                </select>
                            </div>

                            <div class="space-y-2">
                                <label for="inputRating" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    Rating <span class="text-rose-500">*</span>
                                </label>
                                <input type="text" id="inputRating" required placeholder="Contoh: Sangat Patuh, Patuh, Cukup Patuh" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                            </div>
                        </div>

                        <!-- 2. Nilai Minimum & Nilai Maximum -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="space-y-2">
                                <label for="inputNilaiMinimum" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    Nilai Minimum <span class="text-rose-500">*</span>
                                </label>
                                <input type="number" step="any" id="inputNilaiMinimum" required placeholder="Contoh: 85" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                            </div>

                            <div class="space-y-2">
                                <label for="inputNilaiMaximum" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    Nilai Maximum <span class="text-rose-500">*</span>
                                </label>
                                <input type="number" step="any" id="inputNilaiMaximum" required placeholder="Contoh: 100" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                            </div>
                        </div>

                        <!-- 3. Deskripsi -->
                        <div class="space-y-2">
                            <label for="inputDeskripsi" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                Deskripsi
                            </label>
                            <textarea id="inputDeskripsi" rows="3" placeholder="Tuliskan keterangan atau kriteria untuk rating penilaian ini..." class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"></textarea>
                        </div>

                        <!-- 4. Active Checkbox -->
                        <div class="space-y-2">
                            <span class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                Status
                            </span>
                            <label for="checkboxActiveRating" class="inline-flex items-center space-x-2.5 cursor-pointer select-none pt-0.5">
                                <input type="checkbox" id="checkboxActiveRating" checked onchange="updateActiveLabel()" class="w-4 h-4 rounded border-slate-600 bg-[#131a29] text-blue-600 focus:ring-2 focus:ring-blue-500/40 cursor-pointer accent-blue-600">
                                <span id="labelActiveRating" class="text-xs font-semibold text-emerald-400 transition">Active</span>
                            </label>
                        </div>

                    </div>

                    <!-- Footer Tombol Aksi -->
                    <div class="px-6 py-4 bg-[#131a29]/70 border-t border-slate-800 flex items-center justify-end space-x-3">
                        <a href="rating-penilaian.html" class="px-5 py-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition">
                            Batal
                        </a>
                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-2">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Simpan Rating</span>
                        </button>
                    </div>
                </form>

            </main>

        </div>
    </div>

    <!-- Panggil Script Sidebar Eksternal -->
    <script src="../../sidebar.js"></script>

    <!-- Script Dropdown Tahun, Active Checkbox & Submit Form -->
    <script>
        const STORAGE_KEY = "ecompliance_rating_penilaian_v3";

        const defaultRatings = [
            { id: 1, tahun: "2026", rating: "Sangat Patuh", min: 85, max: 100, deskripsi: "Seluruh kewajiban kepatuhan terpenuhi sempurna dan bukti dukung valid.", active: true },
            { id: 2, tahun: "2026", rating: "Patuh", min: 70, max: 84.99, deskripsi: "Kepatuhan terpenuhi dengan baik dengan catatan perbaikan minor.", active: true },
            { id: 3, tahun: "2026", rating: "Cukup Patuh", min: 55, max: 69.99, deskripsi: "Kepatuhan cukup namun membutuhkan pemantauan dan tindak lanjut rutin.", active: true },
            { id: 4, tahun: "2026", rating: "Kurang Patuh", min: 40, max: 54.99, deskripsi: "Terdapat beberapa gap pemenuhan regulasi yang memerlukan action plan.", active: true },
            { id: 5, tahun: "2026", rating: "Tidak Patuh", min: 0, max: 39.99, deskripsi: "Skor di bawah ambang batas minimal dan memicu eskalasi tindak lanjut.", active: false },
            { id: 6, tahun: "2025", rating: "Sangat Patuh", min: 85, max: 100, deskripsi: "Arsip skala rating tahun 2025 predikat sangat patuh.", active: false }
        ];

        function getStoredRatings() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [...defaultRatings];
                return Array.isArray(parsed) && parsed.length > 0 ? parsed : [...defaultRatings];
            } catch (e) {
                return [...defaultRatings];
            }
        }

        function populateTahunDropdown() {
            const select = document.getElementById("selectTahun");
            const existing = getStoredRatings();
            const yearsFromStorage = existing.map(r => String(r.tahun ?? "")).filter(Boolean);
            const baseYears = ["2026", "2025", "2024"];
            const allYears = [...new Set([...baseYears, ...yearsFromStorage])].sort((a, b) => b.localeCompare(a));

            select.innerHTML = allYears
                .map(yr => `<option value="${yr}" ${yr === "2026" ? "selected" : ""}>${yr}</option>`)
                .join("");
        }

        function updateActiveLabel() {
            const checkbox = document.getElementById("checkboxActiveRating");
            const label = document.getElementById("labelActiveRating");

            if (checkbox.checked) {
                label.textContent = "Active";
                label.className = "text-xs font-semibold text-emerald-400 transition";
            } else {
                label.textContent = "Inactive";
                label.className = "text-xs font-semibold text-slate-400 transition";
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const tahun = document.getElementById("selectTahun").value.trim();
            const rating = document.getElementById("inputRating").value.trim();
            const min = Number(document.getElementById("inputNilaiMinimum").value);
            const max = Number(document.getElementById("inputNilaiMaximum").value);
            const deskripsi = document.getElementById("inputDeskripsi").value.trim() || "-";
            const active = document.getElementById("checkboxActiveRating").checked;

            if (!tahun || !rating) {
                alert("Silakan pilih Tahun dan isikan Rating terlebih dahulu.");
                return;
            }

            if (Number.isNaN(min) || Number.isNaN(max)) {
                alert("Nilai Minimum dan Nilai Maximum harus berupa angka.");
                return;
            }

            if (min > max) {
                alert("Nilai Minimum tidak boleh lebih besar dari Nilai Maximum.");
                return;
            }

            const existing = getStoredRatings();
            const nextId = existing.length > 0
                ? Math.max(...existing.map(r => Number(r.id) || 0)) + 1
                : 1;

            existing.push({
                id: nextId,
                tahun,
                rating,
                min,
                max,
                deskripsi,
                active
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));

            alert(
                `Data Rating Penilaian berhasil disimpan!\n\n` +
                `Tahun: ${tahun}\n` +
                `Rating: ${rating}\n` +
                `Nilai Minimum: ${min}\n` +
                `Nilai Maximum: ${max}\n` +
                `Deskripsi: ${deskripsi}\n` +
                `Active: ${active ? "Active" : "Inactive"}`
            );

            window.location.href = "rating-penilaian.html";
        }

        document.addEventListener("DOMContentLoaded", populateTahunDropdown);
    </script>
</body>
</html>
