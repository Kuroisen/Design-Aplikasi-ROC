<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Compliance | Unit Kerja</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar untuk Dark Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0f1422] text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200">

    <div class="flex h-screen overflow-hidden">
        
        <!-- WADAH SIDEBAR OTOMATIS (Di-render oleh sidebar.js) -->
        <div id="sidebar-container"></div>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Header / Navbar -->
            <header class="h-16 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center space-x-4">
                    <!-- Tombol Hamburger untuk Layar Mobile -->
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    
                    <!-- Breadcrumb / Judul Halaman -->
                    <div class="flex items-center space-x-2 text-sm overflow-x-auto whitespace-nowrap">
                        <span class="text-slate-500">Parameter</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <span class="text-slate-500">Unit Organisasi</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <h1 class="font-semibold text-white">Unit Kerja</h1>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-3 shrink-0">
                    <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700/60">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2"></span>
                        System Ready
                    </span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-5">
                
                <!-- Page Header & Tombol Add Unit Kerja -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Unit Kerja</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Kelola daftar unit kerja dan status keaktifannya.</p>
                    </div>
                    <a href="tambah-unit-kerja.html" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5 w-fit shrink-0">
                        <i class="fa-solid fa-plus text-[11px]"></i>
                        <span>Add Unit Kerja</span>
                    </a>
                </div>

                <!-- Card Filter -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl p-4">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center text-xs">
                        
                        <!-- Filter Nama Unit Kerja -->
                        <div class="md:col-span-6 relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="filterNamaUnitKerja" oninput="applyFilters()" placeholder="Filter berdasarkan unit kerja..." class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>

                        <!-- Filter Status -->
                        <div class="md:col-span-4">
                            <select id="filterStatus" onchange="applyFilters()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                                <option value="">Semua Status</option>
                                <option value="Aktif">Aktif</option>
                                <option value="Tidak Aktif">Tidak Aktif</option>
                            </select>
                        </div>

                        <!-- Reset Filter -->
                        <div class="md:col-span-2 flex justify-end">
                            <button type="button" onclick="resetFilters()" class="w-full px-3.5 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-rotate-left text-[11px]"></i>
                                <span>Reset</span>
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Card Tabel: Header Unit Kerja, Status & Action -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-[#131a29] border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="py-3.5 px-6">Unit Kerja</th>
                                    <th class="py-3.5 px-6 w-44">Status</th>
                                    <th class="py-3.5 px-6 w-40 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="unitKerjaTableBody" class="divide-y divide-slate-800/70"></tbody>
                        </table>
                    </div>

                    <!-- Footer Info Jumlah Data -->
                    <div class="px-6 py-3 bg-[#131a29]/60 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                        <span id="tableCountLabel">Menampilkan 0 data</span>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <!-- Modal Edit Unit Kerja -->
    <div id="editUnitKerjaModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#0b0f19] border border-slate-800 rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-[#131a29] px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400 text-xs"></i>
                    <h3 class="text-sm font-semibold text-white">Edit Unit Kerja</h3>
                </div>
                <button type="button" onclick="closeEditUnitKerjaModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleEditUnitKerjaSubmit(event)" class="p-5 space-y-4 text-xs">
                <input type="hidden" id="editUnitKerjaId">

                <div class="space-y-1.5">
                    <label for="editUnitKerjaName" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Unit Kerja <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="editUnitKerjaName" required class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label for="editUnitKerjaStatus" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Status
                    </label>
                    <select id="editUnitKerjaStatus" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                        <option value="Aktif">Aktif</option>
                        <option value="Tidak Aktif">Tidak Aktif</option>
                    </select>
                </div>

                <div class="pt-3 border-t border-slate-800 flex items-center justify-end space-x-2.5">
                    <button type="button" onclick="closeEditUnitKerjaModal()" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition">
                        Batal
                    </button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5">
                        <i class="fa-solid fa-floppy-disk text-[11px]"></i>
                        <span>Update</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panggil Script Sidebar Eksternal -->
    <script src="../../../sidebar.js"></script>

    <!-- Script Data, Filter & Action Unit Kerja -->
    <script>
        let unitKerjaList = [
            { id: 1, nama: "Dirut", status: "Aktif" },
            { id: 2, nama: "Direktorat", status: "Aktif" },
            { id: 3, nama: "Divisi", status: "Aktif" },
            { id: 4, nama: "Bagian", status: "Aktif" },
            { id: 5, nama: "Sub Bagian", status: "Aktif" },
            { id: 6, nama: "Seksi", status: "Tidak Aktif" }
        ];

        function renderTable(data) {
            const tbody = document.getElementById("unitKerjaTableBody");
            const countLabel = document.getElementById("tableCountLabel");

            if (!data.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-8 px-6 text-center text-xs text-slate-500">
                            Tidak ada data unit kerja yang sesuai dengan filter.
                        </td>
                    </tr>
                `;
                countLabel.textContent = "Menampilkan 0 data";
                return;
            }

            tbody.innerHTML = data.map(item => {
                const isAktif = item.status === "Aktif";
                const badgeClass = isAktif
                    ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
                    : "bg-slate-700/40 text-slate-400 border-slate-600/60";

                const toggleIconClass = isAktif
                    ? "fa-solid fa-ban text-amber-400"
                    : "fa-solid fa-circle-check text-emerald-400";
                const toggleTitle = isAktif ? "Nonaktifkan" : "Aktifkan";

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3.5 px-6 font-medium text-slate-200">${item.nama}</td>
                        <td class="py-3.5 px-6">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${badgeClass}">
                                ${item.status}
                            </span>
                        </td>
                        <td class="py-3.5 px-6 text-right">
                            <div class="inline-flex items-center justify-end space-x-2">
                                <button type="button" onclick="openEditUnitKerjaModal(${item.id})" title="Edit" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 transition">
                                    <i class="fa-solid fa-pen-to-square text-xs text-indigo-400"></i>
                                </button>
                                <button type="button" onclick="toggleStatus(${item.id})" title="${toggleTitle}" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/70 transition">
                                    <i class="${toggleIconClass} text-xs"></i>
                                </button>
                                <button type="button" onclick="deleteUnitKerja(${item.id})" title="Hapus" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");

            countLabel.textContent = `Menampilkan ${data.length} dari ${unitKerjaList.length} data`;
        }

        function openEditUnitKerjaModal(id) {
            const target = unitKerjaList.find(u => u.id === id);
            if (!target) return;

            document.getElementById("editUnitKerjaId").value = target.id;
            document.getElementById("editUnitKerjaName").value = target.nama;
            document.getElementById("editUnitKerjaStatus").value = target.status;
            document.getElementById("editUnitKerjaModal").classList.remove("hidden");
            document.getElementById("editUnitKerjaName").focus();
        }

        function closeEditUnitKerjaModal() {
            document.getElementById("editUnitKerjaModal").classList.add("hidden");
        }

        function handleEditUnitKerjaSubmit(event) {
            event.preventDefault();
            const id = Number(document.getElementById("editUnitKerjaId").value);
            const nama = document.getElementById("editUnitKerjaName").value.trim();
            const status = document.getElementById("editUnitKerjaStatus").value;

            if (!nama) return;

            const target = unitKerjaList.find(u => u.id === id);
            if (target) {
                target.nama = nama;
                target.status = status;
            }

            closeEditUnitKerjaModal();
            applyFilters();
        }

        function toggleStatus(id) {
            const target = unitKerjaList.find(u => u.id === id);
            if (!target) return;
            target.status = target.status === "Aktif" ? "Tidak Aktif" : "Aktif";
            applyFilters();
        }

        function deleteUnitKerja(id) {
            const target = unitKerjaList.find(u => u.id === id);
            if (!target) return;
            if (confirm(`Hapus unit kerja "${target.nama}"?`)) {
                unitKerjaList = unitKerjaList.filter(u => u.id !== id);
                applyFilters();
            }
        }

        function applyFilters() {
            const namaQuery = document.getElementById("filterNamaUnitKerja").value.toLowerCase().trim();
            const statusQuery = document.getElementById("filterStatus").value;

            const filtered = unitKerjaList.filter(item => {
                const matchNama = !namaQuery || item.nama.toLowerCase().includes(namaQuery);
                const matchStatus = !statusQuery || item.status === statusQuery;
                return matchNama && matchStatus;
            });

            renderTable(filtered);
        }

        function resetFilters() {
            document.getElementById("filterNamaUnitKerja").value = "";
            document.getElementById("filterStatus").value = "";
            renderTable(unitKerjaList);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderTable(unitKerjaList);
        });
    </script>
</body>
</html>
