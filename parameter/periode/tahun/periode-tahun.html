<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Compliance | Periode Tahun</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar untuk Dark Theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0f1422] text-slate-200 antialiased selection:bg-blue-500/30 selection:text-blue-200">

    <div class="flex h-screen overflow-hidden">
        
        <!-- WADAH SIDEBAR OTOMATIS (Di-render oleh sidebar.js) -->
        <div id="sidebar-container"></div>

        <!-- AREA KONTEN UTAMA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Header / Navbar -->
            <header class="h-16 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center space-x-4">
                    <!-- Tombol Hamburger untuk Layar Mobile -->
                    <button type="button" onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    
                    <!-- Breadcrumb / Judul Halaman -->
                    <div class="flex items-center space-x-2 text-sm overflow-x-auto whitespace-nowrap">
                        <span class="text-slate-500">Parameter</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <span class="text-slate-500">Periode</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <h1 class="font-semibold text-white">Tahun</h1>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-3 shrink-0">
                    <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700/60">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2"></span>
                        System Ready
                    </span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-5">
                
                <!-- Page Header & Tombol Add Tahun -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Periode Tahun</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Kelola daftar tahun kepatuhan, status default, dan status keaktifannya.</p>
                    </div>
                    <a href="tambah-periode-tahun.html" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5 w-fit shrink-0">
                        <i class="fa-solid fa-plus text-[11px]"></i>
                        <span>Add Tahun</span>
                    </a>
                </div>

                <!-- Card Filter -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl p-4">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center text-xs">
                        
                        <!-- Filter Nama Tahun -->
                        <div class="md:col-span-4 relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="filterNamaTahun" oninput="applyFilters()" placeholder="Cari nama / tahun..." class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>

                        <!-- Filter Default -->
                        <div class="md:col-span-3">
                            <select id="filterDefault" onchange="applyFilters()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                                <option value="">Semua Default</option>
                                <option value="Active">Default Active</option>
                                <option value="Inactive">Default Inactive</option>
                            </select>
                        </div>

                        <!-- Filter Active -->
                        <div class="md:col-span-3">
                            <select id="filterActive" onchange="applyFilters()" class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                                <option value="">Semua Active</option>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>

                        <!-- Reset Filter -->
                        <div class="md:col-span-2 flex justify-end">
                            <button type="button" onclick="resetFilters()" class="w-full px-3.5 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-rotate-left text-[11px]"></i>
                                <span>Reset</span>
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Card Tabel: Nama, Default, Active, Aksi -->
                <div class="bg-[#0b0f19] border border-slate-800/90 rounded-xl shadow-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-[#131a29] border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="py-3.5 px-6">Nama</th>
                                    <th class="py-3.5 px-6 w-36 text-center">Default</th>
                                    <th class="py-3.5 px-6 w-36 text-center">Active</th>
                                    <th class="py-3.5 px-6 w-36 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tahunTableBody" class="divide-y divide-slate-800/70"></tbody>
                        </table>
                    </div>

                    <!-- Footer Info Jumlah Data -->
                    <div class="px-6 py-3 bg-[#131a29]/60 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                        <span id="tableCountLabel">Menampilkan 0 data</span>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <!-- Modal Edit Periode Tahun -->
    <div id="editTahunModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#0b0f19] border border-slate-800 rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-[#131a29] px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400 text-xs"></i>
                    <h3 class="text-sm font-semibold text-white">Edit Periode Tahun</h3>
                </div>
                <button type="button" onclick="closeEditTahunModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleEditTahunSubmit(event)" class="p-5 space-y-4 text-xs">
                <input type="hidden" id="editTahunId">

                <div class="space-y-1.5">
                    <label for="editTahunNama" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                        Nama <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="editTahunNama" required class="w-full bg-[#131a29] border border-slate-700/70 rounded-lg px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="flex items-center space-x-6 pt-1">
                    <label for="editDefaultCheckbox" class="inline-flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="editDefaultCheckbox" class="w-4 h-4 rounded border-slate-600 bg-[#131a29] text-blue-600 focus:ring-2 focus:ring-blue-500/40 cursor-pointer accent-blue-600">
                        <span class="text-xs text-slate-300">Default Active</span>
                    </label>

                    <label for="editActiveCheckbox" class="inline-flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="editActiveCheckbox" class="w-4 h-4 rounded border-slate-600 bg-[#131a29] text-blue-600 focus:ring-2 focus:ring-blue-500/40 cursor-pointer accent-blue-600">
                        <span class="text-xs text-slate-300">Active</span>
                    </label>
                </div>

                <div class="pt-3 border-t border-slate-800 flex items-center justify-end space-x-2.5">
                    <button type="button" onclick="closeEditTahunModal()" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 rounded-lg text-xs font-medium transition">
                        Batal
                    </button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow-lg shadow-indigo-600/20 flex items-center space-x-1.5">
                        <i class="fa-solid fa-floppy-disk text-[11px]"></i>
                        <span>Update</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panggil Script Sidebar Eksternal (3 level dari root folder) -->
    <script src="../../../sidebar.js"></script>

    <!-- Script Data, Filter & Aksi Periode Tahun -->
    <script>
        const STORAGE_KEY = "ecompliance_periode_tahun_v1";

        const defaultTahunList = [
            { id: 1, nama: "2026", defaultStatus: "Active", activeStatus: "Active" },
            { id: 2, nama: "2025", defaultStatus: "Inactive", activeStatus: "Active" },
            { id: 3, nama: "2024", defaultStatus: "Inactive", activeStatus: "Inactive" }
        ];

        function normalizeStatusValue(val, fallback = "Inactive") {
            if (typeof val === "boolean") return val ? "Active" : "Inactive";
            if (val === "Active" || val === "Aktif" || val === true) return "Active";
            if (val === "Inactive" || val === "InActive" || val === "Tidak Aktif" || val === false) return "Inactive";
            return fallback;
        }

        function normalizeTahunItem(item, index) {
            return {
                id: item.id ?? index + 1,
                nama: String(item.nama ?? item.tahun ?? "-"),
                defaultStatus: normalizeStatusValue(item.defaultStatus ?? item.default, "Inactive"),
                activeStatus: normalizeStatusValue(item.activeStatus ?? item.active, "Active")
            };
        }

        function loadTahunData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed.map(normalizeTahunItem);
                    }
                } catch (e) {
                    console.error("Gagal membaca data periode tahun:", e);
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultTahunList));
            return defaultTahunList.map(normalizeTahunItem);
        }

        let tahunList = loadTahunData();

        function saveTahunData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tahunList));
        }

        function getStatusBadge(status) {
            const isActive = status === "Active";
            const badgeClass = isActive
                ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
                : "bg-slate-700/40 text-slate-400 border-slate-600/60";
            return `
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${badgeClass}">
                    ${status}
                </span>
            `;
        }

        function renderTable(data) {
            const tbody = document.getElementById("tahunTableBody");
            const countLabel = document.getElementById("tableCountLabel");

            if (!data.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="py-8 px-6 text-center text-xs text-slate-500">
                            Tidak ada data periode tahun yang sesuai dengan filter.
                        </td>
                    </tr>
                `;
                countLabel.textContent = "Menampilkan 0 data";
                return;
            }

            tbody.innerHTML = data.map(item => {
                const isActive = item.activeStatus === "Active";
                const toggleIconClass = isActive
                    ? "fa-solid fa-ban text-amber-400"
                    : "fa-solid fa-circle-check text-emerald-400";
                const toggleTitle = isActive ? "Set Inactive" : "Set Active";

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3.5 px-6 font-semibold text-white">${item.nama}</td>
                        <td class="py-3.5 px-6 text-center">${getStatusBadge(item.defaultStatus)}</td>
                        <td class="py-3.5 px-6 text-center">${getStatusBadge(item.activeStatus)}</td>
                        <td class="py-3.5 px-6 text-right">
                            <div class="inline-flex items-center justify-end space-x-2">
                                <button type="button" onclick="openEditTahunModal(${item.id})" title="Edit" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 transition">
                                    <i class="fa-solid fa-pen-to-square text-xs text-indigo-400"></i>
                                </button>
                                <button type="button" onclick="toggleActiveStatus(${item.id})" title="${toggleTitle}" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/70 transition">
                                    <i class="${toggleIconClass} text-xs"></i>
                                </button>
                                <button type="button" onclick="deleteTahun(${item.id})" title="Hapus" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");

            countLabel.textContent = `Menampilkan ${data.length} dari ${tahunList.length} data`;
        }

        function openEditTahunModal(id) {
            const target = tahunList.find(t => t.id === id);
            if (!target) return;

            document.getElementById("editTahunId").value = target.id;
            document.getElementById("editTahunNama").value = target.nama;
            document.getElementById("editDefaultCheckbox").checked = target.defaultStatus === "Active";
            document.getElementById("editActiveCheckbox").checked = target.activeStatus === "Active";

            document.getElementById("editTahunModal").classList.remove("hidden");
            document.getElementById("editTahunNama").focus();
        }

        function closeEditTahunModal() {
            document.getElementById("editTahunModal").classList.add("hidden");
        }

        function handleEditTahunSubmit(event) {
            event.preventDefault();
            const id = Number(document.getElementById("editTahunId").value);
            const nama = document.getElementById("editTahunNama").value.trim();
            const defaultStatus = document.getElementById("editDefaultCheckbox").checked ? "Active" : "Inactive";
            const activeStatus = document.getElementById("editActiveCheckbox").checked ? "Active" : "Inactive";

            if (!nama) return;

            const target = tahunList.find(t => t.id === id);
            if (target) {
                target.nama = nama;
                target.defaultStatus = defaultStatus;
                target.activeStatus = activeStatus;
                saveTahunData();
            }

            closeEditTahunModal();
            applyFilters();
        }

        function toggleActiveStatus(id) {
            const target = tahunList.find(t => t.id === id);
            if (!target) return;
            target.activeStatus = target.activeStatus === "Active" ? "Inactive" : "Active";
            saveTahunData();
            applyFilters();
        }

        function deleteTahun(id) {
            const target = tahunList.find(t => t.id === id);
            if (!target) return;
            if (confirm(`Hapus periode tahun "${target.nama}"?`)) {
                tahunList = tahunList.filter(t => t.id !== id);
                saveTahunData();
                applyFilters();
            }
        }

        function applyFilters() {
            const namaQuery = document.getElementById("filterNamaTahun").value.toLowerCase().trim();
            const defaultQuery = document.getElementById("filterDefault").value;
            const activeQuery = document.getElementById("filterActive").value;

            const filtered = tahunList.filter(item => {
                const matchNama = !namaQuery || item.nama.toLowerCase().includes(namaQuery);
                const matchDefault = !defaultQuery || item.defaultStatus === defaultQuery;
                const matchActive = !activeQuery || item.activeStatus === activeQuery;
                return matchNama && matchDefault && matchActive;
            });

            renderTable(filtered);
        }

        function resetFilters() {
            document.getElementById("filterNamaTahun").value = "";
            document.getElementById("filterDefault").value = "";
            document.getElementById("filterActive").value = "";
            renderTable(tahunList);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderTable(tahunList);
        });
    </script>
</body>
</html>
